<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PachiSim ロジックテスト</title>
  <style>
    body { font-family: monospace; background:#0f1115; color:#f2f3f5; padding:24px; }
    h1 { font-size:1.1rem; }
    ul { list-style:none; padding:0; }
    li { padding:6px 10px; border-radius:6px; margin-bottom:4px; }
    li.pass { background: rgba(80,200,120,0.15); color:#7ee2a0; }
    li.fail { background: rgba(220,80,80,0.18); color:#ff9d9d; }
    #summary { margin-top:16px; font-weight:bold; }
  </style>
</head>
<body>
  <h1>PachiSim ロジックテスト（ブラウザ実行）</h1>
  <p>Node.jsが無い環境でも動作確認できるよう、ブラウザで開くだけで実行される自作テストランナーです。</p>
  <ul id="results"></ul>
  <p id="summary"></p>

    // 「IDが空ならタグを読み込まない」という仕組みそのものは analytics.tests.js で検証する。
    PachiSim.config.analyticsMeasurementId = "";
  </script>

  <script src="../assets/js/core/rankingStore.js"></script>
  <script src="../assets/js/core/rankingService.js"></script>
  <script src="../assets/js/data/registry.js"></script>
  <!-- machines:start -->

  <!-- テストランナーとテストケース -->
  <script src="assert.js"></script>
  <script src="engine.tests.js"></script>
  <script src="ranking.tests.js"></script>
  <script src="machines.tests.js"></script>
  <script src="analytics.tests.js"></script>

  <script>
    const results = PachiSimTest.getResults();
    const list = document.getElementById("results");
    list.innerHTML = results
      .map(
        (r) =>
          `<li class="${r.pass ? "pass" : "fail"}">${r.pass ? "OK" : "NG"} - ${r.name}${
            r.pass ? "" : ` (${r.error})`
          }</li>`
      )
      .join("");
    const passCount = results.filter((r) => r.pass).length;
    document.getElementById("summary").textContent = `${passCount}/${results.length} passed`;
  </script>
</body>
</html>
