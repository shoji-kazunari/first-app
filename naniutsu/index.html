      <h2 class="policy-title">ナニ打つくん</h2>
      <p class="naniutsu-intro">
        今日いくら打てるかを入れると、直近3ヶ月以内に導入された新台の中から、その金額で勝負になりそうな
        機種ほど選ばれやすい抽選で1台をおすすめします。当たりを保証するものではない、遊びの
        コンテンツとしてお楽しみください。
      </p>

      <section class="card naniutsu-card">
        <form id="naniutsuForm" class="naniutsu-form">
          <label class="naniutsu-form__field">
            <span class="naniutsu-form__label">いくら打てる？</span>
            <span class="naniutsu-form__amount-group">
              <input id="naniutsuAmount" class="naniutsu-form__input naniutsu-form__amount-input" type="text"
                inputmode="numeric" pattern="[0-9]{1,3}" maxlength="3" placeholder="10" required>
              <span class="naniutsu-form__amount-suffix">000円</span>
            </span>
          </label>

          <p id="naniutsuError" class="naniutsu-error" hidden>いくら打てるか（3桁までの数字）を入力してください。</p>

          <button type="submit" class="btn naniutsu-form__submit">ナニ打つ？</button>
        </form>

        <div id="naniutsuResult" class="naniutsu-result" hidden>
          <p id="naniutsuResultText" class="naniutsu-result__text"></p>
          <p id="naniutsuComment" class="naniutsu-result__comment"></p>
          <p class="naniutsu-result__cta"><a id="naniutsuTryLink" href="#" class="btn">試しに打ってみる</a></p>
        </div>
      </section>

      <p class="back-to-top"><a href="../index.html" class="btn btn-secondary">トップにもどる</a></p>
