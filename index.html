<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カウンターアプリ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1 class="title">カウンター</h1>
    <p id="count" class="count">0</p>
    <div class="buttons">
      <button id="minus" class="btn btn-minus" aria-label="マイナス1">-1</button>
      <button id="reset" class="btn btn-reset" aria-label="リセット">リセット</button>
      <button id="plus" class="btn btn-plus" aria-label="プラス1">+1</button>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
